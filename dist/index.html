<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="把最喜欢的长篇、中篇、短篇和同人漫画，收进一张可以分享的个人推荐卡。">
  <title>漫画私藏 · MangaList</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./">漫画私藏<span class="brand-caption" lang="en">MangaList</span></a><span id="progress" role="status">0 / 4 已选</span></header>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">选出你的<span>漫画偏爱</span></h1>
      <p class="intro">长篇、中篇、短篇、同人，各选一本，<br class="mobile-break">把喜欢收进一张推荐卡。</p>
    </section>
    <section class="editor" aria-label="选择四类漫画">
      <div id="slots" class="slots"></div>
      <p class="helper">篇幅由你定义，也可以留空。</p>
      <p id="cover-warning" class="helper" role="status" hidden></p>
      <details class="personalize"><summary>署名与介绍 <span>选填</span></summary>
      <label for="nickname">你的名字</label><input id="nickname" maxlength="20" placeholder="一位漫画爱好者" autocomplete="nickname">
      <label for="tagline">一句话介绍</label><input id="tagline" maxlength="45" placeholder="人生很长，幸好还有漫画。">
      </details>
      <div class="actions"><button id="reset" class="text-button">清空</button><button id="download" class="primary" disabled>下载推荐卡 <span>PNG ↓</span></button></div>
    </section>
    <details id="preview-panel" class="preview"><summary>查看推荐卡 <span>实时预览</span></summary>
      <div class="preview-top"><span>个人推荐卡</span><span>1200 × 1500 px</span></div>
      <div class="canvas-wrap"><canvas id="poster" width="1200" height="1500" role="img" aria-label="个人漫画推荐卡预览"></canvas></div>
    </details>
  </main>
  <footer>选择与封面仅保存在当前浏览器。</footer>
  <dialog id="picker" aria-labelledby="picker-title">
    <div class="dialog-top"><h2 id="picker-title">选择漫画</h2><button id="close" class="icon-button" aria-label="关闭">×</button></div>
    <div class="tabs" role="tablist" aria-label="添加方式"><button id="search-tab" role="tab" aria-selected="true" aria-controls="search-panel">搜索作品</button><button id="manual-tab" role="tab" aria-selected="false" aria-controls="manual-panel">手动添加</button></div>
    <section id="search-panel" role="tabpanel" aria-labelledby="search-tab">
      <form id="search-form"><label class="sr-only" for="query">漫画名称或关键词</label><div class="search-row"><input id="query" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="漫画名称或关键词…" required maxlength="100"><button class="primary" type="submit">搜索</button></div></form>
      <p class="search-tip">搜索结果来自 Bangumi，找不到的作品可手动添加。</p>
      <p id="search-status" role="status">输入漫画名称或关键词开始搜索。</p><div id="results" aria-busy="false"></div>
    </section>
    <section id="manual-panel" role="tabpanel" aria-labelledby="manual-tab" hidden>
      <form id="manual-form"><label for="manual-title">漫画名称 <span class="required">*</span></label><input id="manual-title" required maxlength="70" placeholder="这本漫画叫什么？"><label for="manual-author">作者 / 社团</label><input id="manual-author" maxlength="50" placeholder="选填"><label for="cover">封面图片</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><p class="helper">支持 JPG、PNG、WebP，最大 8 MB；也可以使用文字封面。</p><img id="upload-preview" alt="已上传的封面预览" hidden><button class="primary" type="submit">加入我的私藏</button></form>
    </section>
    <div id="selected-editor" hidden>
      <div class="selected-summary"><span id="selected-name"></span><button id="change" class="text-button">换一本</button></div>
      <div class="selected-cover-row"><div id="selected-cover-wrap" class="selected-cover-wrap"></div><div class="selected-cover-copy"><p id="cover-status" class="helper" role="status"></p><label for="replace-cover">上传或替换封面</label><input id="replace-cover" type="file" accept="image/jpeg,image/png,image/webp"><p class="helper">JPG、PNG、WebP，最大 8 MB。</p></div></div>
      <label for="recommendation">推荐理由</label><textarea id="recommendation" maxlength="80" rows="3" placeholder="它为什么值得一读？（选填，80 字以内）"></textarea>
      <div class="modal-actions"><button id="remove" class="text-button danger">移除这本</button><button id="save" class="primary">保存选择</button></div>
    </div>
    <p id="picker-feedback" role="status" class="helper" hidden></p>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
